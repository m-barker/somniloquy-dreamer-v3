defaults:
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ""
  offline_evaldir: ""
  seed: 0
  log_translation_eval: True
  deterministic_run: False
  steps: 1e6
  parallel: False
  eval_every: 1e4
  eval_episode_num: 15
  log_every: 1e4
  reset_every: 0
  device: "cuda:0"
  compile: True
  precision: 32
  debug: False
  video_pred_log: True
  checkpoint: null
  token_sampling_method: "greedy"
  use_stopwords: False
  ignore_list: []
  no_convert_list: []
  narrator: { narration_key: [] }
  info_keys_to_store: []
  conditional_actions: False
  conditional_policy_attempts: 15
  conditional_epsilon: 0.1
  wandb: True

  # Change these if just learning a dynamics model
  random_actions: False
  env_reward: True
  env_terminate: True

  # For environments which support an option to fix
  # their generation
  fixed_env_seed: -1

  simple_narrator: False
  use_learned_reward: True

  # For when we want to simultaneously learn multiple
  # different reward heads
  multiple_reward_heads: False

  # Translation Evaluation
  save_plots: False
  save_translations: False
  n_translation_eval_episodes: 15
  eval_trajectory_length: 15
  n_consecutive_plans: -1 # -1 means whole episode
  stochastic_env: False
  n_stochastic_plan_samples: 30

  use_bert_transformer: False

  # Environment
  task: "dmc_walker_walk"
  size: [64, 64]
  envs: 1
  action_repeat: 2
  time_limit: 1000
  grayscale: False
  prefill: 2500
  reward_EMA: True

  # Model - DreamerV3 100M Version.
  translation_baseline: false
  enable_language: false
  enable_language_to_latent: false
  enable_language_to_action: false
  evaluate_reconstruction_narration: false
  action_prediction: false
  dyn_hidden: 768
  dyn_deter: 6144
  dyn_stoch: 32
  dyn_discrete: 48
  dyn_rec_depth: 1
  dyn_mean_act: "none"
  dyn_std_act: "sigmoid2"
  dyn_min_std: 0.1
  grad_heads: ["decoder", "reward", "cont"]
  language_grads: false
  units: 768
  act: "SiLU"
  norm: True
  encoder:
    {
      mlp_keys: "$^",
      cnn_keys: "image",
      act: "SiLU",
      norm: True,
      cnn_depth: 48,
      kernel_size: 4,
      minres: 4,
      mlp_layers: 3,
      mlp_units: 768,
      symlog_inputs: True,
    }
  decoder:
    {
      mlp_keys: "$^",
      cnn_keys: "image",
      act: "SiLU",
      norm: True,
      cnn_depth: 48,
      kernel_size: 4,
      minres: 4,
      mlp_layers: 3,
      mlp_units: 768,
      cnn_sigmoid: False,
      image_dist: mse,
      vector_dist: symlog_mse,
      outscale: 1.0,
    }
  actor:
    {
      layers: 3,
      dist: "normal",
      entropy: 3e-4,
      unimix_ratio: 0.01,
      std: "learned",
      min_std: 0.1,
      max_std: 1.0,
      temp: 0.1,
      lr: 4e-5,
      eps: 1e-5,
      grad_clip: 100.0,
      outscale: 0.01,
    }
  critic:
    {
      layers: 3,
      dist: "symlog_disc",
      slow_target: True,
      slow_target_update: 1,
      slow_target_fraction: 0.02,
      lr: 4e-5,
      eps: 1e-5,
      grad_clip: 100.0,
      outscale: 0.0,
    }
  reward_head:
    { layers: 1, dist: "symlog_disc", loss_scale: 1.0, outscale: 0.0 }
  action_prediction_head:
    { layers: 1, dist: "onehot", loss_scale: 1.0, outscale: 0.0 }
  cont_head: { layers: 1, loss_scale: 1.0, outscale: 1.0 }
  translator_head:
    {
      attention_heads: 2,
      encoder_blocks: 2,
      decoder_blocks: 2,
      dropout: 0.1,
      use_bottleneck: True,
      token_embed_size: 256,
      out_head_dim: 256,
      activation: "relu",
      loss_scale: 1.0,
      loss_agg: "mean",
    }
  dyn_scale: 1.0
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: "learned"

  # Training
  batch_size: 16
  batch_length: 64
  # The ratio of model update steps: environment steps
  train_ratio: 512
  pretrain: 0
  model_lr: 4e-5
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 100000
  opt: "adam"

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  imag_horizon: 15
  imag_gradient: "dynamics"
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: "greedy"
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: "stoch"
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

